<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>image edit app</title>
    <link
    href="https://cdn.jsdelivr.net/npm/remixicon@4.8.0/fonts/remixicon.css"
    rel="stylesheet"
/>
    <link rel="stylesheet" href="theme.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <section>
            <div class="left">
                <div class="top">
                    <label class="choose-btn" for="image-choose-label">Choose-img
                        <input class="image-input" type="file" id="image-choose-label" hidden>
                    </label>

                    <div class="reset-btn">Reset</div>
                    <div class="download-btn">Download</div>
                </div>
                <div class="down">
                    <div class="placeholder">
                        <i class="ri-image-line"></i>
                        <h4 >Image</h4>
                    </div>
                    <canvas class="canvas"></canvas>
                </div>
            </div>
            <div class="right">
                <div class="filters">
                    
                    <!-- <div class="filter">
                        <label for="brightness">Brightness</label>
                        <input  class="input-style" type="range" id="brightness" name="brightness" min="0" max="200" value="100">
                    </div> -->

                </div>
            </div>

        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
